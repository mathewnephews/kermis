/* Layout: same night-fair arcade cabinet as Beat The Clown — marquee, HUD strip, scrolling pixel playfield, band roster, controls. Single deliberate dark look. */
:root{
  --night:#140e24; --plum:#271a42; --bulb:#ffd23a; --red:#e0283c; --cream:#fbf1dc; --mint:#6fe39a; --dim:#a99cc4;
  --display:"Press Start 2P", ui-monospace, "Courier New", monospace;
  --body:"Silkscreen", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--cream);font-family:var(--body);
  background-image:radial-gradient(circle at 50% -20%, #3a2363 0, transparent 60%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.025) 0 12px, transparent 12px 24px);}
[hidden]{display:none!important}
.wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:10px;
  padding-block:14px 18px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap.vertical{--gw:min(100%, max(260px, min(440px, calc((100vh - 330px) * .75))))}
.wrap.horizontal{--gw:min(100%, max(300px, min(880px, calc((100vh - 310px) * 1.7778))))}
.marquee{width:var(--gw);text-align:center;padding:14px 10px 12px;border-radius:10px;border:3px solid var(--red);
  background:radial-gradient(circle, var(--bulb) 2px, transparent 3px) top left/14px 10px repeat-x,
             radial-gradient(circle, var(--bulb) 2px, transparent 3px) bottom left/14px 10px repeat-x, var(--plum);
  box-shadow:0 0 0 3px var(--night), 0 0 24px rgba(224,40,60,.45);display:flex;flex-direction:column;gap:6px}
.marquee h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(13px, 4.2vw, 24px);line-height:1.35;color:var(--bulb);
  text-shadow:3px 3px 0 var(--red);letter-spacing:.04em;text-wrap:balance}
.marquee .sub{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--cream)}
.machine{width:var(--gw);display:flex;flex-direction:column;gap:8px}
.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;font-family:var(--display);font-size:clamp(9px, 2.4vw, 12px)}
.hud div{display:flex;flex-direction:column;gap:5px;min-width:0}
.hud div:nth-child(2){align-items:center}.hud div:nth-child(3){align-items:flex-end}
.hud .num{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lbl{color:var(--dim);font-family:var(--body);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.num{font-variant-numeric:tabular-nums}
#time{color:var(--bulb)}
.cabinet{position:relative;width:100%;max-width:100%;border:3px solid #000;border-radius:4px;
  box-shadow:0 0 0 3px var(--bulb), 0 10px 30px rgba(0,0,0,.6);overflow:hidden;background:#2f9a35}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:manipulation}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;text-align:center;
  gap:9px;padding:12px;overflow:auto}
.overlay.full{background:rgba(20,14,36,.88)}
.overlay.banner{pointer-events:none}
.overlay.banner .tag{background:var(--night);border:3px solid var(--bulb);padding:12px 16px;font-family:var(--display);font-size:clamp(10px,3vw,15px);color:var(--bulb);box-shadow:4px 4px 0 var(--red)}
.overlay.banner .big{font-family:var(--display);font-size:clamp(28px,9vw,56px);color:var(--bulb);text-shadow:4px 4px 0 var(--red), -2px -2px 0 #000}
.overlay h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(12px,3.4vw,18px);color:var(--bulb);text-shadow:2px 2px 0 var(--red);text-wrap:balance}
.overlay p{margin:0;max-width:40ch;font-size:clamp(11px,2.6vw,14px);line-height:1.45}
.bigtime{font-family:var(--display);font-size:clamp(20px,6vw,34px);color:var(--cream);text-shadow:3px 3px 0 var(--red)}
.namebox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.namebox label{font-size:12px;letter-spacing:.12em;color:var(--dim)}
#pname{font-family:var(--display);font-size:12px;width:14ch;padding:9px 8px;background:#000;color:var(--mint);border:2px solid var(--mint);
  text-transform:uppercase;caret-color:var(--bulb)}
#pname:focus{outline:3px solid var(--bulb);outline-offset:2px}
#pname.err{border-color:var(--red);animation:nudge .3s}
@keyframes nudge{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.hint{color:var(--red);font-size:12px;min-height:1em}
.plays{list-style:none;margin:0;padding:0;display:grid;gap:2px;font-size:clamp(10px,2.4vw,13px);min-width:min(260px,100%)}
.plays li{display:grid;grid-template-columns:2ch 1fr auto auto auto;gap:4px 10px;text-align:left}
.plays li span.d{color:var(--dim);font-variant-numeric:tabular-nums;text-align:right}
.plays li.hd{color:var(--dim);font-size:.85em;letter-spacing:.1em}
.score{display:grid;grid-template-columns:auto auto auto;gap:3px 14px;font-size:clamp(10px,2.5vw,13px);font-variant-numeric:tabular-nums;text-align:left}
.score span:nth-child(3n){text-align:right;color:var(--mint)}
.score .tot{color:var(--bulb);border-top:2px solid var(--plum);padding-top:3px}
.score span.tot:nth-child(3n){color:var(--bulb)}
.plays li b{color:var(--mint);font-variant-numeric:tabular-nums;font-weight:400}
.plays li.me{color:var(--bulb)}
.plays .h{color:var(--dim);letter-spacing:.12em;display:block;text-align:center}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{font-family:var(--display);font-size:clamp(10px,2.6vw,12px);color:var(--night);background:var(--bulb);border:0;padding:12px 16px;
  box-shadow:3px 3px 0 var(--red);cursor:pointer}
.btn.alt{background:transparent;color:var(--cream);box-shadow:none;border:2px solid var(--dim);padding:10px 14px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--red)}
button:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.small{color:var(--dim);font-size:12px}
.roster{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.chip{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;border:2px solid var(--plum);background:rgba(0,0,0,.25);min-width:0}
.chip img{width:24px;image-rendering:pixelated}
.chip span{font-size:clamp(9px,2.3vw,12px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chip.down{border-color:var(--red);opacity:.55}
.chip.down img{filter:grayscale(1)}
.chip.down span{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;min-height:28px}
.stock{display:flex;gap:14px;align-items:center}
.icons{display:flex;gap:5px;align-items:center}
.icons img{width:22px;image-rendering:pixelated}
.icons.pies img{width:16px}
.miss{font-size:12px;letter-spacing:.08em;color:var(--dim);font-variant-numeric:tabular-nums}
.miss.warn{color:var(--red)}
.power{font-family:var(--display);font-size:11px;color:var(--night);background:var(--bulb);padding:3px 6px;box-shadow:2px 2px 0 var(--red)}
.stock{flex-wrap:wrap}
.toggles{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.ghost{font-family:var(--body);font-size:13px;color:var(--cream);background:transparent;border:2px solid var(--dim);padding:5px 10px;cursor:pointer}
.pad{display:none;width:var(--gw);grid-template-columns:1fr 1fr 1.1fr 1.3fr;gap:10px}
.pad button{font-family:var(--display);font-size:16px;height:64px;border:3px solid #000;background:var(--plum);color:var(--cream);
  box-shadow:0 0 0 2px var(--bulb);touch-action:none;user-select:none;-webkit-user-select:none}
.pad #bF{background:var(--red);font-size:12px}
.pad #bS{background:#6b2fb0;font-size:10px}
.pad button.on{background:var(--bulb);color:var(--night)}
.keys a.secret{color:var(--red);text-decoration:none;font-weight:700}
.keys a.secret:hover,.keys a.secret:focus-visible{color:var(--bulb)}
.keys{margin:0;color:var(--dim);font-size:13px;text-align:center;text-wrap:balance}
@media (pointer:coarse){.pad{display:grid}.keys{display:none}
  .wrap.vertical{--gw:min(100%, max(240px, min(440px, calc((100vh - 420px) * .75))))}}
@media (prefers-reduced-motion:reduce){.btn:active{transform:none}#pname.err{animation:none}}

/* Fit to screen: the column fills the visible screen; the playfield scales into the room that is left */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%}
.wrap{height:100%;min-height:0;gap:8px;overflow:hidden;
  padding-top:max(10px, env(safe-area-inset-top, 0px));padding-bottom:max(10px, env(safe-area-inset-bottom, 0px))}
.wrap>.marquee,.wrap>.machine,.wrap>.pad,.wrap>.keys{width:100%;max-width:var(--colmax)}
.machine{flex:1 1 0;min-height:0}
.stage{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center}
.cabinet{box-sizing:content-box;width:auto;max-width:none;aspect-ratio:auto;flex:none}
.pad button{-webkit-touch-callout:none}
@media (max-height:800px){
  .marquee{padding:8px 8px 7px;gap:2px;background-size:12px 7px,12px 7px,auto}
  .marquee h1{font-size:clamp(12px,3.8vw,18px);text-shadow:2px 2px 0 var(--red)}
  .marquee .sub{font-size:10px}
  .hud div{gap:2px}.hud .lbl{font-size:10px}
  .chip{padding:3px 2px;gap:1px}.chip img{width:18px}
  .bar{min-height:22px}.ghost{font-size:11px;padding:3px 7px}
  .lives img,.icons img{width:18px}.icons.pies img{width:13px}
  .pad button{height:54px}
}
@media (max-height:620px){
  .marquee .sub{display:none}
  .chip span{font-size:9px}
  .pad button{height:48px}
}
@media (max-height:460px) and (orientation:landscape){
  .marquee,.keys{display:none}
  .wrap{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:1fr 1fr;gap:8px 12px;align-items:stretch;justify-items:center}
  .wrap>.machine{grid-column:2;grid-row:1/3;width:100%;height:100%;min-height:0;gap:5px}
  .chip span{display:none}.chip{padding:2px}
  .hud div{flex-direction:row;align-items:baseline;gap:6px}.hud div:nth-child(2),.hud div:nth-child(3){align-items:baseline;justify-content:flex-end}
  .hud div:nth-child(2){justify-content:center}
}
@media (max-height:460px) and (orientation:landscape) and (pointer:coarse){
  .pad{display:contents}
  .pad button{width:76px;height:auto;min-height:0}
  #bL,#bA{grid-column:1;grid-row:1}#bR,#bB{grid-column:1;grid-row:2}
  #bS{grid-column:3;grid-row:1}#bF{grid-column:3;grid-row:2}
  .pad:not(:has(#bS)) #bF{grid-row:1/3}
}
.wrap{--colmax:480px}

/* title flash when a bear is hit */
@keyframes titleflash{0%,100%{color:var(--bulb);text-shadow:3px 3px 0 var(--red)}
  12%,37%,62%,87%{color:#fbf7ef;text-shadow:3px 3px 0 #33b324,0 0 14px #ffd23a}
  25%,50%,75%{color:#f89c1d;text-shadow:3px 3px 0 #6b2fb0,0 0 14px #f89c1d}}
@keyframes bulbflash{0%,100%{box-shadow:0 0 0 3px var(--night),0 0 24px rgba(224,40,60,.45)}50%{box-shadow:0 0 0 3px var(--night),0 0 40px rgba(255,210,58,.9)}}
.marquee.flash h1{animation:titleflash 1.6s steps(1,end)}
.marquee.flash{animation:bulbflash .4s ease-in-out 4}
@media (prefers-reduced-motion:reduce){.marquee.flash h1{animation:titleflash 1.6s steps(1,end) 1}.marquee.flash{animation:none}}
</style>
</head>
<body>


<div class="wrap vertical" style="--colmax:460px">
  <header class="marquee"><h1>GAZZOLEEN</h1><span class="sub">Time Attack Run</span></header>
  <div class="machine">
    <div class="hud">
      <div><span class="lbl">Player</span><span class="num" id="who">---</span></div>
      <div><span class="lbl" id="lvl">Level 1</span><span class="num" id="time">0.00</span></div>
      <div><span class="lbl">Score</span><span class="num" id="score">00000</span></div>
    </div>
    <div class="stage" id="stage"><div class="cabinet" id="cab">
      <canvas id="game" aria-label="Game screen"></canvas>
      <div class="overlay full" id="ov" hidden></div>
    </div></div>
    <div class="roster" id="roster" aria-label="Band members left"></div>
    <div class="bar">
      <div class="stock">
        <div class="icons" id="lives" aria-label="Lives"></div>
        <div class="icons pies" id="supers" aria-label="Super pies"></div>
        <span class="miss" id="miss">Misses 0/2</span>
      </div>
      <div class="toggles"><button class="ghost" id="music" type="button" aria-pressed="true">Music: on</button><button class="ghost" id="mute" type="button" aria-pressed="true">Sound FX: on</button></div>
    </div>
  </div>
  <div class="pad">
    <button id="bA" type="button" aria-label="Move left">&#9664;</button>
    <button id="bB" type="button" aria-label="Move right">&#9654;</button>
    <button id="bS" type="button">SUPER</button>
    <button id="bF" type="button">PIE!</button>
  </div>
  <p class="keys">&larr; &rarr; or A D to move &middot; Space or click to throw &middot; X for a super pie &middot; P to pause &middot; M for music<a href="clown-invaders.html" class="secret" aria-label="Play Clown Invaders">.</a></p>
</div>

function miss(b){
  if(b.pw)return;
  const [x,y]=scr(b.u,6);pops.push({x,y:y+6,s:'MISS',t:.8,c:'#a99cc4'});noise(.08,.04);
  const down=band.filter(m=>!m.alive);if(!down.length)return;
  misses++;
  if(misses>=2){misses=0;const m=down[Math.random()*down.length|0];
    m.alive=true;m.warn=0;m.v=-(16+Math.random()*30);m.u=MA+8+Math.random()*(ACROSS-2*(MA+8));
    pops.push({x:W/2,y:H/2-10,s:m.t.name+' IS BACK!',t:1.4,c:'#ff5a5a'});
    jingle([[523,.08],[392,.08],[262,.16]],-10);roster();}
  hud();
}
function superFire(){
  if(state!=='play'||supers<=0)return;let target=null;
  for(const m of band)if(m.alive&&m.v>-ML&&(!target||m.v>target.v))target=m;if(!target)return;
  supers--;hud();fired++;lvFired++;tone(300,1400,.25,'square',.06);
  shots.push({u0:cu,v0:PV-CL,u1:target.u,v1:target.v,t:.25,sup:true});hitMember(target,true);
}

/* ---------- update ---------- */
function update(dt){
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=90*dt;p.t-=dt;}parts=parts.filter(p=>p.t>0);
  for(const p of pops){p.y-=14*dt;p.t-=dt;}pops=pops.filter(p=>p.t>0);
  for(const s of splats)s.t-=dt;splats=splats.filter(s=>s.t>0);
  for(const s of shots)s.t-=dt;shots=shots.filter(s=>s.t>0);
  if(shake>0)shake-=dt;

  const moving=state==='play'||state==='count'||state==='title'||state==='levelup';
  const mul=speedFor(level)*(1+elapsed*.025);
  if(moving){const sp=ALONG/(state==='title'?9:6)*(state==='play'?mul:speedFor(level))*dt;scroll=(scroll+sp)%ALONG;
    for(const s of scen)s.v+=sp;scen=scen.filter(s=>s.v<ALONG+24);
    const top=scen.reduce((a,s)=>Math.min(a,s.v),Infinity);if(top>40+Math.random()*50)spawnRide(-20);}

  if(state==='levelup'){luT-=dt;
    if(luT<1.7&&!luStep){luStep=1;show(`<div class="tag">Level ${level+1}<br><br>${menFor(level+1)} band members</div>`,'banner');tone(660,880,.2,'square',.05);}
    if(luT<=0)nextLevel();return;}
  if(state==='count'){countT-=dt;const n=countT>2.1?'3':countT>1.4?'2':countT>.7?'1':'GO!';
    if(n!==lastCount){lastCount=n;show(`<div class="big">${n}</div>`,'banner');tone(n==='GO!'?880:440,n==='GO!'?880:440,n==='GO!'?.3:.12,'square',.06);}
    if(countT<=0){state='play';setTimeout(()=>{if(state==='play'&&lastCount==='GO!')hide();},350);}return;}
  if(state!=='play')return;

  elapsed+=dt;clock();
  const spd=ACROSS*.5;if(keys.a)cu-=spd*dt;if(keys.b)cu+=spd*dt;cu=Math.max(CA+3,Math.min(ACROSS-CA-3,cu));
  cool-=dt;if(keys.f&&cool<=0)fire();if(state!=='play')return;
  if(invul>0)invul-=dt;

  if(power>0){power=Math.max(0,power-dt);showPower();
    if(Math.random()<.6){const [x,y]=scr(cu+(Math.random()-.5)*16,PV+(Math.random()-.5)*16);parts.push({x,y,vx:0,vy:-20,t:.35,c:Math.random()<.5?'#ffd23a':'#fbf7ef'});}}
  // bear balloon: floats down to the ground, rests there briefly, then pops
  if(!bear){bearT-=dt;if(bearT<=0){const k=Math.random()*2|0;
    bear=VERT?{u:20+Math.random()*(ACROSS-40),v:-14}:{u:-14,v:ALONG*(.12+Math.random()*.5)};
    Object.assign(bear,{base:bear.u,ph:0,land:0,img:BEAR_BALLOONS[k],col:k?'#f89c1d':'#33b324'});}}
  else{bear.ph+=dt;
    if(!bear.land){
      if(VERT){bear.v+=ALONG/8*dt;bear.u=clamp(bear.base+Math.sin(bear.ph*1.4)*ACROSS*.08,12,ACROSS-12);if(bear.v>=ALONG-13){bear.v=ALONG-13;bear.land=2.5;}}
      else{bear.u+=ACROSS/8*dt;bear.v=clamp(bear.v+(ALONG*.05+Math.cos(bear.ph*1.4)*ACROSS*.12)*dt,12,ALONG-12);if(bear.u>=ACROSS-13){bear.u=ACROSS-13;bear.land=2.5;}}
      if(bear.land){const [x,y]=scr(bear.u,bear.v);burst(x,y+10,['#f3dc8a','#fbf7ef'],8,25);tone(200,140,.08,'triangle',.04);}
    }else{bear.land-=dt;if(bear.land<=0){const [x,y]=scr(bear.u,bear.v);burst(x,y-3,[bear.col,'#fbf7ef'],20,50);noise(.1,.06);bear=null;bearT=7+Math.random()*5;}}
    if(bear){const [hu,hv]=bearHead();if(Math.abs(hu-cu)<CA+9&&Math.abs(hv-PV)<CL+9)powerUp();}}
  const bandSpeed=ALONG/3.4*mul;
  const warnCount=band.filter(m=>m.alive&&m.warn>0).length+ebolts.length;
  for(const m of band){if(!m.alive)continue;
    m.v+=bandSpeed*dt;
    if(Math.abs(m.u-cu)<MA+CA-2&&Math.abs(m.v-PV)<ML+CL-2){hurt('A band member ran straight into you.');m.v=-(20+Math.random()*40);m.warn=0;if(state!=='play')return;}
    if(m.v>ALONG+12){m.v=-(10+Math.random()*40);m.u=MA+8+Math.random()*(ACROSS-2*(MA+8));m.warn=0;}
    if(m.warn>0){m.warn-=dt;if(m.warn<=0){ebolts.push({u:m.u,v:m.v+ML});noise(.08,.05);tone(220,110,.12,'sawtooth',.05);}}
    else if(elapsed>=6&&warnCount<1&&m.v>8&&m.v<PV-36&&Math.random()<(.14+elapsed*.002)*dt){m.warn=.5;m.wu=m.u;tone(180,180,.06,'square',.03);}
  }
  const ps=ALONG*2.4*dt;
  for(const b of bolts){const old=b.v;b.v-=ps;b.u+=(b.du||0)*dt;
    if(b.u<-4||b.u>ACROSS+4){b.dead=true;continue;}
    if(bear){const [hu,hv]=bearHead();if(Math.abs(b.u-hu)<=10&&b.v<=hv+9&&old+BL>=hv-9){b.dead=true;powerUp();continue;}}
    let t=null;for(const m of band)if(m.alive&&Math.abs(m.u-b.u)<=MA+1&&b.v<=m.v+ML&&old+BL>=m.v-ML&&(!t||m.v>t.v))t=m;
    if(t){b.dead=true;hitMember(t);if(state!=='play')return;continue;}
    if(b.v+BL<0){b.dead=true;miss(b);}}
  bolts=bolts.filter(b=>!b.dead);
  const es=ALONG*1.15*speedFor(level)*dt;
  for(const b of ebolts){const old=b.v;b.v+=es;
    if(Math.abs(b.u-cu)<=CA-1&&b.v+EBL>=PV-CL&&old<=PV+CL){b.dead=true;hurt('A band member\'s shot hit you.');if(state!=='play')return;}
    if(b.v>ALONG)b.dead=true;}
  ebolts=ebolts.filter(b=>!b.dead);
  for(const b of warnBeams){b.t-=dt;if(Math.abs(b.u-cu)<=CA-1){hurt('You walked into a band member\'s shot.');if(state!=='play')return;}}
  warnBeams=warnBeams.filter(b=>b.t>0);
}

/* ---------- render ---------- */
function blit(img,u,v){const [x,y]=scr(u,v);ctx.drawImage(img,Math.round(x-img.width/2),Math.round(y-img.height/2));}
function pixLine(x0,y0,x1,y1,col,sz){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy,i=0;
  for(;;){ctx.fillStyle=typeof col==='function'?col(i++):col;ctx.fillRect(x0-(sz>>1),y0-(sz>>1),sz,sz);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}
const RAINBOW=['#e0283c','#ff8a1f','#ffd23a','#57c84a','#38b6e8','#9b4ae0'];
function render(){
  ctx.save();
  if(shake>0){ctx.translate(Math.round((Math.random()-.5)*4),Math.round((Math.random()-.5)*4));}
  lane(()=>{const o=Math.floor(scroll);ctx.drawImage(BG,0,o);ctx.drawImage(BG,0,o-ALONG);});
  for(const s of scen)blit(s.c,s.u,s.v);
  for(const s of splats)blit(SPLAT,s.u,s.v);
  // warning lines + enemy shots (drawn in run space)
  lane(()=>{
    for(const m of band){if(!m.alive||m.warn<=0)continue;if((m.warn*16|0)%2)continue;ctx.fillStyle='#ff3b3b';
      const v0=Math.ceil(m.v+ML)+2;for(let v=v0;v<v0+16;v+=4)ctx.fillRect(Math.round(m.u),v,1,2);}
    for(const b of warnBeams){const v0=Math.max(0,Math.round(b.v0));ctx.fillStyle='#e0283c';ctx.fillRect(Math.round(b.u)-2,v0,5,ALONG-v0);
      ctx.fillStyle='#fbf7ef';ctx.fillRect(Math.round(b.u),v0,1,ALONG-v0);}
    for(const b of bolts){const u=Math.round(b.u),v=Math.round(b.v);ctx.fillStyle=b.pw?'#ffd23a':'#ff8a1f';ctx.fillRect(u-1,v,3,BL);ctx.fillStyle='#fff6c2';ctx.fillRect(u,v,1,BL-2);}
    for(const b of ebolts){const u=Math.round(b.u),v=Math.round(b.v);ctx.fillStyle='#8e1424';ctx.fillRect(u-1,v,3,EBL);ctx.fillStyle='#ff3b3b';ctx.fillRect(u,v+1,1,EBL-1);}
  });
  if(bear&&!(bear.land>0&&bear.land<.8&&((bear.land*12)|0)%2))blit(bear.img,bear.u,bear.v);
  for(const m of band){if(!m.alive)continue;const f=((m.v/5)|0)&1;blit(m.t.spr[f<0?0:f],m.u,m.v);}
  for(const s of shots){if(!s.sup)continue;const [x0,y0]=scr(s.u0,s.v0),[x1,y1]=scr(s.u1,s.v1);const off=(s.t*40)|0;
    pixLine(x0,y0,x1,y1,i=>RAINBOW[((i>>2)+off)%RAINBOW.length],3);}
  if(state!=='lost'||lives>0){if(!(invul>0&&((invul*14)|0)%2))blit(CLOWN,cu,PV);}
  for(const p of parts){ctx.fillStyle=p.c;ctx.fillRect(p.x|0,p.y|0,1,1);}
  for(const p of pops)txt(p.s,Math.max(10,Math.min(W-10,p.x)),p.y,p.c);
  ctx.restore();
}

let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);render();requestAnimationFrame(loop);}

/* ---------- input ---------- */
const MOVE=VERT?{ArrowLeft:'a',KeyA:'a',ArrowRight:'b',KeyD:'b'}:{ArrowUp:'a',KeyW:'a',ArrowDown:'b',KeyS:'b'};
const overlayOpen=()=>!ov.hidden&&ov.classList.contains('full');
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'){if(e.key==='Enter'){e.preventDefault();tryStart();}return;}
  if(e.target.tagName==='BUTTON'&&(e.code==='Space'||e.code==='Enter')&&overlayOpen())return;
  if(MOVE[e.code]||e.code==='Space'){e.preventDefault();}
  if((e.code==='Enter'||e.code==='Space')&&(state==='won'||state==='lost')&&overlayOpen()){begin();return;}
  if(e.code==='Enter'&&state==='title'){tryStart();return;}
  if(e.code==='KeyP'||e.code==='Escape'){togglePause();return;}
  if(e.code==='KeyM'){$('music').click();return;}
  if(e.code==='KeyX'&&!e.repeat){superFire();return;}
  if(MOVE[e.code])keys[MOVE[e.code]]=true;
  if(e.code==='Space'&&state==='play'&&!e.repeat&&cool<=0)fire();
  if(e.code==='Space')keys.f=true;
});
addEventListener('keyup',e=>{if(MOVE[e.code])keys[MOVE[e.code]]=false;if(e.code==='Space')keys.f=false;});
cv.addEventListener('pointerdown',e=>{if(state==='play'&&cool<=0)fire();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')togglePause();});
[['bA','a'],['bB','b'],['bF','f']].forEach(([id,k])=>{const b=$(id);
  const on=e=>{e.preventDefault();ac();keys[k]=true;b.classList.add('on');if(k==='f'&&state==='play'&&cool<=0)fire();};
  const off=()=>{keys[k]=false;b.classList.remove('on');};
  b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,off));
  b.addEventListener('contextmenu',e=>e.preventDefault());});
$('bS').addEventListener('pointerdown',e=>{e.preventDefault();superFire();});
$('mute').onclick=e=>{muted=!muted;const b=e.currentTarget;b.textContent='Sound FX: '+(muted?'off':'on');b.setAttribute('aria-pressed',String(!muted));b.blur();};
$('music').onclick=e=>{musicOn=!musicOn;const b=e.currentTarget;b.textContent='Music: '+(musicOn?'on':'off');b.setAttribute('aria-pressed',String(musicOn));b.blur();
  if(musicOn)startMusic();if(state!=='paused')musicLevel(musicOn?MVOL:0);};

seedScenery();titleScreen();requestAnimationFrame(loop);

/* fit the playfield into the space left on screen */
(()=>{const cab=document.querySelector('.cabinet'),st=document.getElementById('stage');
  function fit(){const r=st.getBoundingClientRect();let w=Math.min(r.width-6,(r.height-6)*W/H);w=Math.max(120,Math.floor(w));
    cab.style.width=w+'px';cab.style.height=Math.floor(w*H/W)+'px';}
  fit();addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,300));
  if(window.visualViewport)visualViewport.addEventListener('resize',fit);
  if(window.ResizeObserver)new ResizeObserver(fit).observe(st);})();
})();
</script>
